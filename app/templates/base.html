<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Opportunity Radar{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="/static/app.css"></head>
<body><div class="shell">
<aside class="sidebar">
<div class="brand"><div class="logo">OR</div><div><b>Opportunity Radar</b><small>Personal job intelligence</small></div></div>
<nav>
<a href="/" class="{{'active' if request.url.path=='/' else ''}}">Dashboard</a>
<a href="/companies" class="{{'active' if request.url.path.startswith('/companies') else ''}}">Companies</a>
<a href="/jobs" class="{{'active' if request.url.path=='/jobs' else ''}}">Jobs</a>
<a href="/pipeline" class="{{'active' if request.url.path=='/pipeline' else ''}}">Pipeline</a>
<a href="/discover" class="{{'active' if request.url.path=='/discover' else ''}}">Discover</a>
<a href="/analytics" class="{{'active' if request.url.path=='/analytics' else ''}}">Analytics</a>
<a href="/settings" class="{{'active' if request.url.path=='/settings' else ''}}">My Profile</a>
<a href="/export.csv">Export CSV</a>
</nav><p class="side-note">Public research only. Review leads and messages before outreach.</p>
</aside><main>{% block content %}{% endblock %}</main></div>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}</body></html>
